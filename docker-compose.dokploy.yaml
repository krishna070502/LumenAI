# LumenAI — Dokploy deployment
#
# Dokploy: Create Project -> Compose -> Provider: Git -> Compose Path:
#   ./docker-compose.dokploy.yaml
# Then:
#   1. Environment tab: paste the variables listed in .env.example
#      (required: DATABASE_URL, NEON_AUTH_BASE_URL, ADMIN_EMAIL,
#       NEXT_PUBLIC_APP_URL, SEARXNG_SECRET).
#   2. Domains tab: add your domain -> Service: lumenai, Port: 3000, HTTPS on.
#      Dokploy injects the Traefik labels itself, so none are set here.
#
# Postgres + auth are external (Neon), so no database service is defined.
# SearXNG runs as its own container on a private network only: it is never
# attached to dokploy-network, so its DNS name cannot collide with another
# deployment on the same host.

services:
  lumenai:
    build:
      context: .
      dockerfile: Dockerfile.slim
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SEARXNG_API_URL: http://searxng:8080
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-}
    volumes:
      # config.json + uploads/ both live under ./data
      - lumenai-data:/home/gradia-aiengine/data
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - internal
      - dokploy-network

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

volumes:
  lumenai-data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
